<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Esqueci minha senha</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background-color: #ffffff;
        }
        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card text-center">
            <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
            <h3 class="mb-3">Esqueci minha senha</h3>
            <p class="text-muted small mb-4">
                Informe o e-mail cadastrado. Enviaremos um link para você criar uma nova senha.
            </p>

            <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}"></div>
            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

            <form th:action="@{/esqueci-senha}" method="post" th:unless="${mensagem}">
                <div class="form-group mb-3 text-start">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="seu@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar link de redefinição</button>
            </form>

            <div class="mt-3">
                <a th:href="@{/login}" class="text-decoration-none">Voltar ao login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
