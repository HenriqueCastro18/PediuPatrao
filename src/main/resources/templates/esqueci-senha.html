<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Redefinir senha</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background-color: #ffffff;
        }
        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card text-center">
            <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
            <h3 class="mb-4">Redefinir senha</h3>

            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

            <form th:action="@{/esqueci-senha}" method="post">
                <div class="form-group mb-3 text-start">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username"
                           th:value="${username}" placeholder="Digite seu nome de usuário" required>
                </div>
                <div class="form-group mb-3 text-start">
                    <label for="senha" class="form-label">Nova senha</label>
                    <input type="password" class="form-control" id="senha" name="senha"
                           placeholder="Digite a nova senha" required>
                </div>
                <div class="form-group mb-3 text-start">
                    <label for="confirmaSenha" class="form-label">Confirmar senha</label>
                    <input type="password" class="form-control" id="confirmaSenha" name="confirmaSenha"
                           placeholder="Repita a nova senha" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Redefinir senha</button>
            </form>

            <div class="mt-3">
                <a th:href="@{/login}" class="text-decoration-none">Voltar ao login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
