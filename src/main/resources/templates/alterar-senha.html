<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Alterar senha</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-shield-lock me-2 text-primary"></i>Alterar senha</h2>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert" style="max-width: 540px;">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert" style="max-width: 540px;">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm" style="max-width: 540px;">
        <div class="card-body p-4">
            <p class="text-muted small mb-3">
                Para alterar sua senha, confirme a senha atual. Caso tenha esquecido,
                solicite a redefinição a um administrador.
            </p>
            <form th:action="@{/alterar-senha}" method="post">
                <div class="mb-3">
                    <label for="senhaAtual" class="form-label fw-medium">Senha atual</label>
                    <input type="password" class="form-control" id="senhaAtual" name="senhaAtual"
                           placeholder="••••••••" required autocomplete="current-password"/>
                </div>
                <div class="mb-3">
                    <label for="novaSenha" class="form-label fw-medium">Nova senha</label>
                    <input type="password" class="form-control" id="novaSenha" name="novaSenha"
                           placeholder="Mínimo de 4 caracteres" minlength="4" required autocomplete="new-password"/>
                </div>
                <div class="mb-4">
                    <label for="confirmaSenha" class="form-label fw-medium">Confirmar nova senha</label>
                    <input type="password" class="form-control" id="confirmaSenha" name="confirmaSenha"
                           placeholder="Repita a nova senha" minlength="4" required autocomplete="new-password"/>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i> Salvar nova senha
                </button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
