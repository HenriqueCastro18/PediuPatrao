<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-clipboard-check me-2 text-primary"></i>Auditoria
        </h2>
        <div class="btn-group">
            <a href="/auditoria" class="btn btn-sm btn-outline-secondary"
               th:classappend="${filtroEntidade == null} ? 'active'">Todos</a>
            <a href="/auditoria?entidade=PEDIDO" class="btn btn-sm btn-outline-secondary"
               th:classappend="${filtroEntidade == 'PEDIDO'} ? 'active'">Pedidos</a>
            <a href="/auditoria?entidade=CLIENTE" class="btn btn-sm btn-outline-secondary"
               th:classappend="${filtroEntidade == 'CLIENTE'} ? 'active'">Clientes</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Data/Hora</th>
                        <th>Usuário</th>
                        <th>Perfil</th>
                        <th>Operação</th>
                        <th>Entidade</th>
                        <th>Alterações</th>
                        <th>Justificativa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum registro de auditoria.
                        </td>
                    </tr>
                    <tr th:each="r : ${registros}">
                        <td class="ps-4" th:text="${r.dataHora != null} ? ${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm')} : '-'"></td>
                        <td th:text="${r.usuario}"></td>
                        <td><span class="badge bg-secondary" th:text="${r.perfil}"></span></td>
                        <td th:text="${r.operacao}"></td>
                        <td>
                            <span th:text="${r.entidade}"></span>
                            <span class="text-muted small" th:text="'#' + ${r.entidadeId}"></span>
                        </td>
                        <td>
                            <div th:each="c : ${r.camposAlterados}" class="small">
                                <strong th:text="${c.campo}"></strong>:
                                <span th:text="${c.valorAnterior} ?: '(vazio)'"></span>
                                &rarr;
                                <span th:text="${c.valorNovo} ?: '(vazio)'"></span>
                            </div>
                        </td>
                        <td class="small" th:text="${r.justificativa} ?: '-'"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(registros)}">
            Total: <strong th:text="${#lists.size(registros)}"></strong> registro(s)
        </div>
    </div>

</div>

</body>
</html>
