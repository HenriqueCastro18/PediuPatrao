<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <a href="/produtos/novo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th class="text-end">Preço</th>
                        <th class="text-center">Estoque</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum produto cadastrado.
                        </td>
                    </tr>
                    <tr th:each="p : ${produtos}">
                        <td class="ps-4 fw-medium" th:text="${p.nome}"></td>
                        <td th:text="${p.tipo}"></td>
                        <td class="text-end" th:text="'R$ ' + ${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td class="text-center">
                            <span class="badge"
                                  th:classappend="${p.quantidadeEstoque != null and p.quantidadeEstoque > 0} ? 'bg-success' : 'bg-danger'"
                                  th:text="${p.quantidadeEstoque != null ? p.quantidadeEstoque : 0}"></span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${p.ativo} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${p.ativo} ? 'Sim' : 'Não'"></span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/produtos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </a>
                            <form th:action="@{/produtos/{id}/deletar(id=${p.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Excluir este produto?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash-fill"></i> Excluir
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
